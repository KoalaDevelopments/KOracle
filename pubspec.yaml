name: koracle
description: "KOracle: share your screen with friends."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Renders the Design System's IBM Plex Mono.
  google_fonts: ^8.2.1
  kodev_ui:
    git:
      url: https://github.com/KoalaDevelopments/KODevUI.git
      ref: main
  koracle_engine:
    git:
      url: https://github.com/KoalaDevelopments/KOracleEngine.git
      ref: work/screen-sharing-platform-architecture-63e3b3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
